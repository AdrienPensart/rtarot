[package]
name = "rtarot-cli"
description = "Terminal interface for the rtarot engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
default-run = "rtarot"

[[bin]]
name = "rtarot"
path = "src/main.rs"

[dependencies]
rtarot-core.workspace = true
ordered-float.workspace = true
strum.workspace = true
clap = { version = "4.5.21", features = ["derive"] }
colored = "3.0.0"
lazy-regex = "3.1.0"
rand = "0.10"

[lints]
workspace = true
